  # ---------- fallback 되묻기 ----------
  # enable_when이 아니라 엔진 조건으로 낸다: N4로 찾은 증상이 fallback(ref.recommend_departments의
  # is_fallback = true)일 때만. 아래 enable_when(Q0 = no)은 응급 흐름에서 나오지 않게 하는 최소 조건이다.
  - link_id: F1
    order: 800
