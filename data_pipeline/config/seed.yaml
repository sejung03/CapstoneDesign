# 6·7단계: Supabase ref 스키마 시드 (pipeline/06a_build_seed.py → db/seed/<data_version>/*.csv)
# 스키마는 db/migrations/001_ref_schema.sql. 컬럼 순서는 SQL과 같다.

data_version: v2.1-20261113
data_version_note: "표준 증상 v2.1(197개), 사전 v3, 2A-2 최종 진료과 추천(2026-11-13)"
seed_dir: db/seed/v2.1-20261113
stats: data/interim/v6/seed_stats.json

inputs:
  standard: data/processed/v3/standard_symptoms_v2_1.csv
  synonym: data/processed/v3/symptom_synonym_v3.csv
  final: data/processed/v4/symptom_department_final.csv
  path_b: data/processed/v4/symptom_department_path_b.csv
  fallback: data/processed/v4/fallback_departments.csv
  # 표준 진료과 목록 = 진료과 표기 라벨링(S4)의 선택지(의원급 표시과목 + 추가 과). 과 이름만 읽는다
  dept_options: labels/v4/inputs/label_options_dept.csv
  dept_id: config/department_id.csv
  search_key: config/dept_search_key.csv
  # search_key 매핑을 다시 만들 때만 읽는다(--refresh-search-key). 읽기만 한다
  frontend_departments: ../frontend/departments.mjs

# ref.source. S1~S7은 팀 내부 문서(확정사항 및 방법론) 1장, S8은 이 프로젝트가 정한 항목(예외 증상·하위 구분·직접 추가 표현)
sources:
  - {source_id: S1, name: "AI Hub 초거대AI 사전학습용 헬스케어 질의응답 데이터(71762)", version: "VL", url: "https://www.aihub.or.kr", license: "AI Hub 이용약관(원본 재배포 불가)", note: "답변 문장은 DB에 넣지 않음. 증상 표현(구절)과 경로 A 계산에만 사용"}
  - {source_id: S2, name: "건강보험심사평가원 병원급 이상 진료과목별 상병 통계", version: "20251231", url: "https://www.data.go.kr", license: "", note: "경로 B 병원급 순위"}
  - {source_id: S3, name: "건강보험심사평가원 의원급 표시과목별 상병 통계", version: "20251231", url: "https://www.data.go.kr", license: "", note: "경로 B 의원급 순위"}
  - {source_id: S4, name: "건강보험심사평가원 상병마스터", version: "20250930", url: "https://www.data.go.kr", license: "", note: "KCD 코드명"}
  - {source_id: S5, name: "119 구급상황관리센터 상담 매뉴얼", version: "2020", url: "", license: "", note: "주증상 범주 33개(config/triage_119.yaml)"}
  - {source_id: S6, name: "팀 문진 「응급 및 비응급 공통 문진」", version: "", url: "", license: "", note: "1차 적재에서는 쓰지 않음"}
  - {source_id: S7, name: "ICPC-2e (International Classification of Primary Care, WONCA)", version: "v7.0", url: "https://www.ehelse.no", license: "배포 전 확인 필요(README TODO)", note: "표준 증상 체계와 ICD-10 연결"}
  - {source_id: S8, name: "프로젝트 정의(두 평가자 라벨링 합의·설정 규칙)", version: "", url: "", license: "", note: "예외 증상(EX), 하위 구분(D20-0x), 직접 추가·보류 표현"}

# 증상 source → source_id
symptom_source:
  exception: S8
  default: S7          # ICPC 코드 기반 증상(하위 구분 포함)
# 사전 source → source_id
synonym_source:
  aihub_T3: S1
  step1: S1            # 1단계 후보: AI Hub 표본 답변에서 뽑은 표현
  added_common: S8
  held: S8
  subdivision: S8
  exception: S8

# ref.app_config: recommend.yaml에서 옮길 값(from = 점으로 이은 경로) 또는 고정 값(value).
# 값 안의 진료과 이름은 dept_id로 바꿔 넣는다.
app_config:
  - {key: max_recommendations, from: max_recommendations, note: "추천 최대 개수"}
  - {key: clinic_second_min_share, from: clinic_second_min_share, note: "의원급 2순위 과를 추천에 넣는 최소 비율"}
  - {key: min_share_hospital_fill, from: min_share_hospital_fill, note: "병원급으로 채우는 rec2·rec3 최소 비율"}
  - {key: dept_sex, from: dept_sex, note: "진료과 대상 성별. 다른 성별 사용자에게는 숨김(ref.symptom_department_variant에 미리 반영)"}
  - {key: dept_age, from: dept_age, note: "진료과 대상 최대 나이. 넘으면 숨김, 나이를 모르면 보여줌(variant에 미리 반영)"}
  - {key: sex_filter, from: sex_filter, note: "성별 제한 증상에서 빼는 과(빌드 때 적용됨)"}
  - {key: dept_scope, from: dept_scope, note: "해당 화면 그룹 증상에서만 추천하는 과(빌드 때 적용됨)"}
  - {key: pediatric_top, from: pediatric_top, note: "pediatric_top 판정 기준"}
  - {key: injury_triage_categories, from: fallback.injury_triage_categories, note: "외상 판정 119 범주"}
  - {key: injury_icpc_codes, from: fallback.injury_icpc_codes, note: "외상 판정 ICPC 코드"}
  - {key: never_recommend, from: fallback.never, note: "추천·fallback에 넣지 않는 과(응급은 응급 버튼이 처리)"}
  - {key: emergency_button_always_visible, value: true, note: "응급 신고 버튼은 항상 표시"}
  - {key: child_max_age, value: 18, note: "age_band child = 만 18세 이하 (ref.recommend_departments)"}
