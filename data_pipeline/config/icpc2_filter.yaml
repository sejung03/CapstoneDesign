# ICPC-2 증상 코드(component 1) 중 앱 안내 대상에서 빼는 규칙 (pipeline/01b_icpc2_extract.py)
# 결정적 규칙만 둔다. 한 코드가 여러 규칙에 걸리면 excluded_reason에 모두 ";"로 적는다.

component1:
  code_pattern: "^[A-Z][0-9]{2}$"   # 영문자 1개 + 숫자 2개
  number_min: 1
  number_max: 29

exclude:
  chapters:                           # 장 전체 제외
    Z: z_social_problem               # 사회 문제는 진료과 안내 대상이 아님
  preferred_prefixes:                 # preferred가 이 문구로 시작하면 제외
    "Fear": fear                      # 질병에 대한 걱정 ("Fear of …" 37개 + X27 여성 생식기·유방 질환 걱정(기타))
    "Limited function/disability": limited_function   # 기능 제한
  codes: {}                           # 개별 코드 제외 (예: {A01: 이유}). 지금은 없음

# 검증값. 하나라도 다르면 파일을 쓰지 않고 멈춘다.
expected:
  component1: 320
  z_social_problem: 27
  fear: 38
  limited_function: 16
  remaining: 240
