# 3단계 S3-3: 후보 구절 → 라벨링 입력(T3) 만들기 (2026-11-12)
# 스크립트: pipeline/03c_label_inputs_t3.py
# input·output은 입력을 "만드는" 쪽 경로다(data/interim/). 실제 라벨링에 쓴 입력과 결과는 labels/v3/에 있고,
# 합치기(S3-5)는 아래 merge 절의 labels/ 경로를 읽는다.

input:
  phrases: data/interim/v3/candidate_phrases.csv
  options_t1: data/interim/v2/label_options_T1.csv
  guide_v2: data/interim/v2/labeling_guide.md
  standard: data/processed/v2/standard_symptoms_v2.csv

output:
  items: data/interim/v3/label_items_T3.csv
  rare: data/interim/v3/phrases_rare.csv
  options: data/interim/v3/label_options_T3.csv
  guide: data/interim/v3/labeling_guide_T3.md

# 라벨링 대상: 아래를 모두 만족하는 구절
#   script만인 구절은 라벨링하지 않는다(빈도 세기 도구로만 사용).
target:
  known: "false"
  sources: [claude_read, both]
  min_n_answers: 10

# phrases_rare: known=false이고 sources에 속하지만 n_answers < min_n_answers인 구절
#   (script만인 구절과 known=true 구절은 candidate_phrases.csv에만 남는다)

# 띄어쓰기만 다른 구절(공백을 뺀 문자열이 같음)은 한 item으로 합친다.
#   phrase = 대표 표기 (n_answers가 같으면 공백 있는 표기), variants = 모든 표기(대표가 맨 앞)
#   라벨 결과는 S3-5에서 variants의 모든 표기에 적용해 사전에 넣는다.
#   phrases_rare.csv는 합치지 않는다.
variants_sep: "; "

item_id:
  prefix: "T3-"
  width: 4

# 선택지에 덧붙일 하위 코드 (standard_symptoms_v2.csv에서 parent_id가 이 값인 행)
#   label_options_T1.csv의 상위 코드 행 바로 아래에 넣는다.
subdivided_parents: [D20]

# 하위 코드 설명 (선택지의 inclusion 칸과 라벨링 규칙에 쓴다)
subcode_desc:
  D20-01: 혀
  D20-02: 입술·입안
  D20-03: 입냄새
  D20-04: 입마름

# 라벨링 규칙에 덧붙이는 줄
guide_extra_rules:
  - "AMBIGUOUS를 고를 때는 note에 후보 코드를 반드시 모두 적는다(예: AMBIGUOUS (R21, L01))."
  - "입·혀·입술 관련 표현은 D20 대신 하위 코드(D20-01~D20-04)를 고른다."

# ---------- S3-5: T3 라벨 합치기 (pipeline/03c_merge_labels_t3.py) ----------
# 규칙은 config/v2_merge.yaml의 T1 규칙(agreed / agreed_partial / agreed_span / none / disagree)을 그대로 쓴다.
# 평가자·후보 겹침 사용 여부·v2 T2 결과(이름·119 범주)도 v2_merge.yaml 값을 읽는다.
# 바꾼 것은 후보 코드 패턴 하나: T3 선택지에 하위 코드(D20-01…)가 있어 note의 "D20-01"을 "D20"으로
#   잘라 읽지 않도록 뒤의 "-숫자 2자리"를 함께 읽는다. (2026-11-12, T3-1041 한 건이 해당)
merge:
  items: labels/v3/inputs/label_items_T3.csv      # 라벨링에 쓴 입력 (예문 칸은 삭제됨, 합치기에 쓰지 않음)
  options: labels/v3/inputs/label_options_T3.csv
  labels_dir: labels/v3                       # <평가자>/T3.csv
  code_pattern: "[A-Z][0-9]{2}(?:-[0-9]{2})?"
  term_source: aihub_T3                        # 사전 v3에서 T3 채택분의 source 값
  # D20처럼 하위 구분된 상위 코드로 채택된 표현은 config/symptom_subdivision.yaml의 keywords로
  # 하위에 배정한다(v2 01e와 같은 방법). 키워드에 안 걸리면 상위에 남긴다.
  v2:
    standard: data/processed/v2/standard_symptoms_v2.csv
    synonyms: data/processed/v2/symptom_synonym_v2.csv
    labels_dir: labels/v2                       # <평가자>/T2.csv
    t2_items: labels/v2/inputs/label_items_T2.csv
    icpc: data/interim/v2/icpc2_symptoms_all.csv
    kcd_link: data/interim/v2/icpc2_kcd_link.csv
  # 이름 확정 (2026-11-13): name_ko → name_ko_final, name_status=final.
  #   동의어 파일에서 옛 이름이 대표 표현이면 옛 이름은 동의어로 바꾸고 새 이름을 대표로 넣는다
  #   (새 이름이 그 증상의 표현으로 이미 있으면 그 행을 대표로 바꾼다).
  name_final: config/name_final_v2_1.csv
  name_final_source: name_final        # 새 이름 대표 행의 source·status 값
  output:
    terms: data/processed/v3/term_to_symptom_T3.csv
    standard: data/processed/v3/standard_symptoms_v2_1.csv   # v2 + v2.1 추가 증상 (컬럼은 v2와 같음)
    synonyms: data/processed/v3/symptom_synonym_v3.csv       # v2 사전 + T3 채택분
    stats: data/interim/v3/s3_5_merge_stats.json
