# 3단계 S3-5 (4~5): 증상 답변 전체에 사전을 매칭해 질환별 증상을 만든다 (pipeline/03c_match_all.py)
# 매칭 방법: config/symptom_match.yaml (공백 무시, min_term_length, 왼쪽 경계)
# 문맥 제외: config/symptom_exclusion.yaml
# kept 기준값: config/recommend.yaml의 path_a 절
# LLM은 쓰지 않는다.

answers: data/interim/v3/symptom_answers.csv

# 사전 = 동의어 파일의 term + 표준 증상 파일의 name_ko (symptom_match.yaml 머리말과 같은 정의)
# v3로 질환별 증상을 만들고, v2는 매칭률 비교에만 쓴다.
dictionaries:
  v3:
    synonyms: data/processed/v3/symptom_synonym_v3.csv
    standard: data/processed/v3/standard_symptoms_v2_1.csv
  v2:
    synonyms: data/processed/v2/symptom_synonym_v2.csv
    standard: data/processed/v2/standard_symptoms_v2.csv

# 겹치는 매칭은 긴 표현(공백 제외 글자 수)만 남긴다. 길이가 같으면 앞에서 시작한 것.
# term_type=span 표현은 연결된 증상 모두에 이 값만큼 센다. 같은 답변에서 같은 증상은 한 번(가장 큰 값)만 센다.
span_weight: 0.5

output:
  disease_symptom: data/processed/v3/disease_symptom.csv
  # 답변별 매칭 결과(답변 본문 없음). 추적용
  answer_symptom: data/interim/v3/answer_symptom.csv
  # 제외 예시(답변 문맥 포함). reports/에는 답변 문장을 넣지 않으므로 여기에만 둔다
  examples: data/interim/v3/step3_examples.csv
  stats: data/interim/v3/s3_5_match_stats.json
  report: reports/step3_build.md

report:
  top_n: 20
  excluded_examples: 10    # 예시 파일 행 수, 보고서의 규칙별 상위 증상 수
  example_context: 20      # 예시 파일에서 표현 앞뒤로 보여 줄 글자 수
